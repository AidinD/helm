# The app lane, on GitHub's machines instead of a developer's.
#
# WHAT THIS IS
# The 156 checks in scripts/app-checks launch the real Electron app, and for months none of them
# ran in CI - which the pure lane says out loud on every run, because a green tick that covers
# half the behaviour and looks complete is the failure this repo has spent months removing.
#
# It started as a probe of one question: does Electron start, and does the harness's debugger
# connection attach, on a GitHub-hosted Windows runner at all? The answer is yes, and the
# whole lane now runs here in about eleven minutes rather than the hour that was feared.
#
# WHICH CHECKS RUN IS DECIDED IN CODE, NOT HERE
# scripts/ci-app-lane-plan.mjs discovers the lane and names the checks it deliberately does
# not run, with the reason and what would have to be true to remove each one. It lives in a
# script rather than in this file so it can be read, tested and mutated like anything else -
# and so an exclusion has to be argued for in a place a reviewer will actually look.
#
# An excluded check is reported as excluded and subtracted from the total. It is never
# counted as passed, which is the only rule here that matters.
#
# ON EVERY PUSH TO MAIN since 2026-09-08, nightly as well, and by hand whenever you want it.
# The trigger block below carries the reasoning for the cadence and the caveats that come with
# a scheduled workflow.
#
# NOT A GATE. Read-only, writes nothing, must not be a required check.
name: app-lane

on:
  # ON PUSH TO MAIN, AND NIGHTLY. Nothing about this runs on a developer workstation, so it does
  # not matter whether one is switched on - the runner is started, used and destroyed by GitHub.
  #
  # THE TRADE WAS WRITTEN HERE TO BE REVISITED, AND ON 2026-09-08 IT WAS. What this file said
  # was: "nightly finds a break the morning after, on-push finds it before later work is stacked
  # on top of it. Both cost the same, which is nothing." Then it happened. A change adding a
  # widget to the seedable list broke an assertion in the DOCS-STALENESS check - a coupling
  # nobody would have predicted, which is the whole argument against choosing a cheap subset by
  # judgement. It merged at nine in the evening, the schedule found it at six the next morning,
  # and it reached the captain only because he opened GitHub himself. Nine hours, and the last
  # hop was luck.
  #
  # Eleven minutes is only a cost when somebody waits for it, and nobody waits for this one: the
  # pure lane still answers in under two minutes on every push and is the signal you work
  # against. This lane now also runs the moment something becomes true on main, which is the
  # moment worth catching - the difference between a break found before the next change is
  # stacked on it and a break found after.
  #
  # WHY THE WHOLE LANE AND NOT A CHEAP SUBSET. A subset has to be chosen, and choosing it means
  # predicting which checks a change can break. The break that prompted this was a widget list
  # reaching a docs test; the seven before it were checks describing mechanisms that had moved.
  # Neither set was predictable, and a subset curated from yesterday's surprises is the same
  # mistake with more maintenance. Minutes are free here - the repository is public - so the
  # honest option is the one that needs no judgement.
  #
  # WHAT THIS IS STILL NOT: a gate. It is read-only, it is not a required check, and nothing
  # waits on it. It reports.
  #
  # A NOTE ON CANCELLATION, because it changes what the CI widget shows. The concurrency block
  # below cancels a run when a newer one starts on the same ref, so a burst of merges leaves
  # only the last one's verdict - correct, since the last main is the one that matters. Helm's
  # own CI widget reads a cancelled run as UNKNOWN rather than as pass or fail, so during a
  # burst it says "not known" for a few minutes instead of showing a stale green. That is the
  # honest answer to "what is the state of this head", and it resolves itself when the final
  # run lands.
  push:
    branches: [main]
    # No paths-ignore. Filtering by path means predicting which files can break which checks,
    # which is the same judgement a subset needs and the same one that has now been wrong
    # twice - a widget list broke a docs test, and a renderer change broke a session-steal test.
  #
  # THE SCHEDULE STAYS, as a backstop rather than as the primary signal. It catches the things a
  # push cannot: a flake that only shows under a different runner's load, and a break that comes
  # from the outside world rather than from a commit - an action version moving, a runner image
  # changing, a dependency's published tag being retagged underneath us.
  #
  # THE TIME IS UTC and GitHub does not do time zones. 01:17 UTC is the small hours in
  # Stockholm year-round (02:17 or 03:17 depending on daylight saving), which is what matters:
  # the result is waiting in the morning either way. The odd minute is deliberate - the
  # scheduler is heavily queued on the hour and a run asked for at :00 can drift by a long way.
  #
  # ONE THING TO KNOW ABOUT SCHEDULED WORKFLOWS: GitHub disables them after 60 days without
  # activity in the repository. A quiet repo therefore stops being checked silently, which is
  # exactly the failure this lane exists to prevent - so if it ever goes quiet, check that the
  # schedule is still enabled before believing the last green result.
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      checks:
        description: "Space-separated app checks to run. Empty runs the WHOLE app lane."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: app-lane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-lane:
    # Windows for the same reason the pure lane is on Windows, and one more: this app is
    # Windows-targeted, and an Electron start on Linux would answer a question nobody asked.
    runs-on: windows-latest
    # ~153 checks at roughly 20s each. 90 leaves room for a slow runner without letting a
    # hung check burn an hour of somebody's minutes.
    timeout-minutes: 90
    steps:
      - name: Check out Helm
        uses: actions/checkout@v4
        with:
          path: helm

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # `npm install --ignore-scripts` on purpose, and both halves of that matter.
      #
      # INSTALL, not `ci`: the lockfile is behind on the `file:` siblings, so `ci` refuses.
      # IGNORE-SCRIPTS: this repo's own postinstall check refuses an install when a fatal
      # sibling is missing, which is right on a developer's machine and wrong here - keel is
      # already placed by hand above, and @jot/core is deliberately absent. Skipping scripts
      # also skips other packages' install hooks, which is a smaller blast radius than letting
      # an unrelated dependency run code on a runner.
      #
      # Electron itself IS needed and its download is the expensive part; there is no way to
      # answer this workflow's question without it.
      - name: Install dependencies
        working-directory: helm
        run: npm install --ignore-scripts --no-audit --no-fund

      # `--ignore-scripts` above skips THIS repo's postinstall check, which is right here (keel
      # is placed by hand and @jot/core is deliberately absent) - but it also skipped ELECTRON's
      # own postinstall, and that is the step that downloads the actual binary. The npm package
      # is only a downloader. The first run of this probe failed with "Electron failed to
      # install correctly" for exactly that reason: one flag turned off two different things.
      #
      # So Electron's installer is run explicitly, which is narrower than letting every
      # package's install hook run on a runner.
      - name: Download the Electron binary (its own postinstall, run on purpose)
        working-directory: helm
        run: node node_modules/electron/install.js

      # AFTER the install, not before, and the second probe run is why. npm sees
      # `keel: file:../keel`, finds no such directory beside the repo, and PRUNES the
      # node_modules/keel that was checked out by hand - so the app started and died on
      # `Cannot find package 'keel'`. The order was the bug, and the app's own stderr said so
      # the moment the harness surfaced it.
      # And clear what npm left there first. This is the dangling symlink the whole sibling
      # story is about, met head-on: npm created node_modules/keel as a link to `../keel`,
      # which does not exist on a runner, and `actions/checkout` then failed with
      # "ENOENT: mkdir node_modules\keel" - it follows the broken link, finds nothing, and can
      # neither create nor overwrite. Removing the link is the whole fix.
      - name: Clear the dangling link npm left where keel belongs
        working-directory: helm
        shell: bash
        run: |
          if [ -e node_modules/keel ] || [ -L node_modules/keel ]; then
            rm -rf node_modules/keel
            echo "removed what npm left at node_modules/keel"
          else
            echo "nothing at node_modules/keel"
          fi
          mkdir -p node_modules

      - name: Check out keel into node_modules (after the install, which would prune it)
        uses: actions/checkout@v4
        with:
          repository: AidinD/keel
          path: helm/node_modules/keel

      # This repo's OWN postinstall check, run explicitly rather than skipped. `--ignore-scripts`
      # above is right for the install itself but it turned this off too - and this is the check
      # that names a missing sibling at install time, which is exactly the failure that cost the
      # second probe run. Using it here means the probe is verified by the same guard a developer
      # gets, instead of by a hand-rolled copy of it. keel is now present, and the optional
      # sibling is absent on purpose, which this check warns about and does not fail on.
      - name: Confirm the siblings resolve (the repo's own install check)
        working-directory: helm
        run: node scripts/check-siblings.mjs

      # The BINARY, not the package. The first version of this step checked that the directory
      # and its package.json existed and passed while Electron was broken - so the probe
      # reported a failure that looked like "Electron cannot run here" when the truth was
      # "Electron was never downloaded". A check that passes against a broken install is worse
      # than no check: it moves the blame.
      - name: Confirm the Electron BINARY exists
        working-directory: helm
        shell: bash
        run: |
          node -e "
            const fs = require('node:fs');
            const path = require('node:path');
            const pkg = require('electron/package.json');
            const pathFile = path.join('node_modules', 'electron', 'path.txt');
            if (!fs.existsSync(pathFile)) {
              console.error('electron/path.txt is missing - the binary was never downloaded, so this probe would blame the runner for an install problem.');
              process.exit(1);
            }
            const bin = path.join('node_modules', 'electron', 'dist', fs.readFileSync(pathFile, 'utf8').trim());
            if (!fs.existsSync(bin)) {
              console.error('the Electron binary is not at ' + bin + ' - same problem.');
              process.exit(1);
            }
            console.log('electron ' + pkg.version + ' binary present at ' + bin);
          "

      # HELM_E2E_HIDDEN=1 is the harness default anyway, but it is set explicitly here because
      # part of the question this lane answered was whether a hidden window can lay out and be
      # driven over the debugger on a machine with no interactive desktop session.
      - name: The app lane
        working-directory: helm
        shell: bash
        env:
          HELM_E2E_HIDDEN: "1"
        run: |
          set +e
          # The plan decides what runs and what is excluded, and it FAILS the job if it names
          # an exclusion whose file no longer exists - a stale name is how an exclusion list
          # rots into fiction, so it is a hard error rather than a warning.
          node scripts/ci-app-lane-plan.mjs > lane-plan.txt
          if [ $? -ne 0 ]; then
            cat lane-plan.txt
            echo "the lane plan refused to produce a list; nothing was run"
            exit 1
          fi
          files=$(grep '^RUN ' lane-plan.txt | cut -d' ' -f2- | tr '\n' ' ')
          excluded=$(grep -c '^NOTE       - ' lane-plan.txt)
          if [ -n "${{ github.event.inputs.checks }}" ]; then
            echo "Overridden by hand, so the exclusion list does not apply: ${{ github.event.inputs.checks }}"
            files="${{ github.event.inputs.checks }}"
            excluded=0
          fi

          failed=0
          ran=0
          declare -a red=()
          for check in $files; do
            ran=$((ran+1))
            echo "########## $check"
            node "scripts/app-checks/$check"
            code=$?
            if [ $code -ne 0 ]; then
              failed=$((failed+1))
              red+=("$check")
            fi
            echo "---------- $check exited $code"
          done

          echo ""
          echo "APP LANE RESULT"
          echo "  ran $ran, failed $failed, excluded $excluded (not run, not counted)"
          if [ $failed -gt 0 ]; then
            echo "  red:"
            for r in "${red[@]}"; do echo "    - $r"; done
          fi
          echo ""
          grep '^NOTE' lane-plan.txt | sed 's/^NOTE //; s/^NOTE$//'
          exit $failed
