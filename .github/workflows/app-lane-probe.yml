# Can the app lane run on a machine that is not the author's? One question, cheaply.
#
# WHY THIS IS A PROBE AND NOT THE APP LANE
# 153 of the 308 checks in scripts/e2e launch the real Electron app, and none of them run in
# CI - which the pure lane says out loud on every run, because a green tick that covers half
# the behaviour and looks complete is the failure this repo has spent months removing.
#
# Running all 153 would cost roughly an hour of runner time per push and needs a real
# `npm install` (Electron is a ~100MB download; `npm ci` is not an option here because two
# dependencies are `file:` paths to sibling repositories and the lockfile is behind). Before
# spending any of that on a schedule, there is exactly one thing worth knowing:
#
#     does Electron start, and does the harness's debugger connection attach, on a
#     GitHub-hosted Windows runner at all?
#
# Everything else about widening this is trivial once that answer is yes, and pointless if it
# is no. So this runs a handful of representative checks, by hand, and answers that.
#
# MANUAL ONLY. No push trigger and no schedule until the answer is known - committing to
# nightly cost on a guess is how a CI bill becomes a surprise, and a scheduled red nobody
# expected is how a workflow gets ignored.
#
# NOT A GATE. Read-only, writes nothing, must not be a required check.
name: app-lane-probe

on:
  workflow_dispatch:
    inputs:
      checks:
        description: "Space-separated app checks to run (default: a small representative set)"
        required: false
        default: "test-frameless-header.mjs test-command-palette.mjs test-chat-markdown.mjs"

permissions:
  contents: read

concurrency:
  group: app-lane-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    # Windows for the same reason the pure lane is on Windows, and one more: this app is
    # Windows-targeted, and an Electron start on Linux would answer a question nobody asked.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out Helm
        uses: actions/checkout@v4
        with:
          path: helm

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # `npm install --ignore-scripts` on purpose, and both halves of that matter.
      #
      # INSTALL, not `ci`: the lockfile is behind on the `file:` siblings, so `ci` refuses.
      # IGNORE-SCRIPTS: this repo's own postinstall check refuses an install when a fatal
      # sibling is missing, which is right on a developer's machine and wrong here - keel is
      # already placed by hand above, and @jot/core is deliberately absent. Skipping scripts
      # also skips other packages' install hooks, which is a smaller blast radius than letting
      # an unrelated dependency run code on a runner.
      #
      # Electron itself IS needed and its download is the expensive part; there is no way to
      # answer this workflow's question without it.
      - name: Install dependencies
        working-directory: helm
        run: npm install --ignore-scripts --no-audit --no-fund

      # `--ignore-scripts` above skips THIS repo's postinstall check, which is right here (keel
      # is placed by hand and @jot/core is deliberately absent) - but it also skipped ELECTRON's
      # own postinstall, and that is the step that downloads the actual binary. The npm package
      # is only a downloader. The first run of this probe failed with "Electron failed to
      # install correctly" for exactly that reason: one flag turned off two different things.
      #
      # So Electron's installer is run explicitly, which is narrower than letting every
      # package's install hook run on a runner.
      - name: Download the Electron binary (its own postinstall, run on purpose)
        working-directory: helm
        run: node node_modules/electron/install.js

      # AFTER the install, not before, and the second probe run is why. npm sees
      # `keel: file:../keel`, finds no such directory beside the repo, and PRUNES the
      # node_modules/keel that was checked out by hand - so the app started and died on
      # `Cannot find package 'keel'`. The order was the bug, and the app's own stderr said so
      # the moment the harness surfaced it.
      # And clear what npm left there first. This is the dangling symlink the whole sibling
      # story is about, met head-on: npm created node_modules/keel as a link to `../keel`,
      # which does not exist on a runner, and `actions/checkout` then failed with
      # "ENOENT: mkdir node_modules\keel" - it follows the broken link, finds nothing, and can
      # neither create nor overwrite. Removing the link is the whole fix.
      - name: Clear the dangling link npm left where keel belongs
        working-directory: helm
        shell: bash
        run: |
          if [ -e node_modules/keel ] || [ -L node_modules/keel ]; then
            rm -rf node_modules/keel
            echo "removed what npm left at node_modules/keel"
          else
            echo "nothing at node_modules/keel"
          fi
          mkdir -p node_modules

      - name: Check out keel into node_modules (after the install, which would prune it)
        uses: actions/checkout@v4
        with:
          repository: AidinD/keel
          path: helm/node_modules/keel

      # This repo's OWN postinstall check, run explicitly rather than skipped. `--ignore-scripts`
      # above is right for the install itself but it turned this off too - and this is the check
      # that names a missing sibling at install time, which is exactly the failure that cost the
      # second probe run. Using it here means the probe is verified by the same guard a developer
      # gets, instead of by a hand-rolled copy of it. keel is now present, and the optional
      # sibling is absent on purpose, which this check warns about and does not fail on.
      - name: Confirm the siblings resolve (the repo's own install check)
        working-directory: helm
        run: node scripts/check-siblings.mjs

      # The BINARY, not the package. The first version of this step checked that the directory
      # and its package.json existed and passed while Electron was broken - so the probe
      # reported a failure that looked like "Electron cannot run here" when the truth was
      # "Electron was never downloaded". A check that passes against a broken install is worse
      # than no check: it moves the blame.
      - name: Confirm the Electron BINARY exists
        working-directory: helm
        shell: bash
        run: |
          node -e "
            const fs = require('node:fs');
            const path = require('node:path');
            const pkg = require('electron/package.json');
            const pathFile = path.join('node_modules', 'electron', 'path.txt');
            if (!fs.existsSync(pathFile)) {
              console.error('electron/path.txt is missing - the binary was never downloaded, so this probe would blame the runner for an install problem.');
              process.exit(1);
            }
            const bin = path.join('node_modules', 'electron', 'dist', fs.readFileSync(pathFile, 'utf8').trim());
            if (!fs.existsSync(bin)) {
              console.error('the Electron binary is not at ' + bin + ' - same problem.');
              process.exit(1);
            }
            console.log('electron ' + pkg.version + ' binary present at ' + bin);
          "

      # The one thing being measured. HELM_E2E_HIDDEN=1 is the harness default anyway, but it
      # is set explicitly here because the whole question is whether a hidden window can lay
      # out and be driven over the debugger on a machine with no interactive desktop session
      # of the kind a developer has.
      - name: Probe - can the app start and be driven here
        working-directory: helm
        shell: bash
        env:
          HELM_E2E_HIDDEN: "1"
        run: |
          set +e
          failed=0
          for check in ${{ github.event.inputs.checks }}; do
            echo "########## $check"
            node "scripts/e2e/$check"
            code=$?
            echo "---------- $check exited $code"
            if [ $code -ne 0 ]; then failed=$((failed+1)); fi
          done
          echo ""
          echo "PROBE RESULT"
          echo "  This answers ONE question: whether Electron starts and the harness attaches"
          echo "  on a hosted runner. It is NOT app-lane coverage - 153 checks launch the app"
          echo "  and this ran a handful of them by hand."
          if [ $failed -eq 0 ]; then
            echo "  Every probed check passed, so the app lane is worth widening here."
          else
            echo "  $failed probed check(s) failed. Read the output above before concluding it"
            echo "  cannot work: a check can fail on a runner for reasons that have nothing to"
            echo "  do with Electron starting (no git identity, no user profile, a path that"
            echo "  only exists on a developer machine). Whether the APP started is the answer"
            echo "  being sought, and the harness prints that."
          fi
          exit $failed
