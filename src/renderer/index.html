<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The sha256 in script-src whitelists ONLY the Lavish annotation SDK's
         exact inline script (see src/lib/lavishSdk.js buildArtifactSdkSource).
         A framed data: document still has the embedder's CSP applied on top of
         its own, so the parent must permit the SDK by hash for it to run in the
         mockup iframe — the rest of the app stays inline-script-free. If the
         SDK source changes this hash must be regenerated; spike/test-lavish.mjs
         asserts the committed hash matches so drift fails loudly. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-7qivjsfTz8Pbb+3ahDnziZ4KbQ0CZ9376EcBHrsIKOk='; style-src 'self' 'unsafe-inline'; img-src 'self' file:; frame-src 'self' data:" />
    <meta name="color-scheme" content="dark" />
    <title>Helm</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="brand"><img class="logo" src="assets/helm-logo.png" alt="Helm" /><h1>Helm</h1><span class="app-version" id="appVersion"></span><span class="dev-badge hidden" id="devBadge" title="This is the DEV build (npm start). It reads its own data dir (repo root), separate from the installed app (~/.helm) - so its fleet & sessions differ by design.">DEV</span><button class="stale-build-pill hidden" id="staleBuildPill" type="button" title="A newer build is on disk. Restart Helm to pick it up."></button><button class="stale-build-pill hidden" id="modelFreshnessPill" type="button"></button><span class="cmdk-hint" id="cmdkHint" title="Open command palette (Ctrl+K)">Ctrl K</span></div>
      <div class="header-controls">
        <!-- Dashboard is HOME - the single primary surface (orchestrator-first:
             live state, not a chat prompt). Plan/Analysis/Archive are deliberate
             detours, demoted to the quieter secondary nav so the front door is
             oversight, not a co-equal chat tab (UX research R1). Chat itself has
             no standalone nav entry - every "open a session" action on the
             Dashboard already lands there, plus the command palette's
             "Go to Chat" (the captain decision 2026-07-08). -->
        <div class="view-toggle" id="pageToggle">
          <button data-page="dashboard" class="active">Dashboard<span class="attention-badge hidden" id="dashboardAttentionBadge"></span><span class="run-indicator hidden" id="dashboardRunningIndicator"></span></button>
        </div>
        <div class="view-toggle header-utility-nav" id="headerUtilityNav">
          <button data-page="jot">Jot</button>
          <button data-page="lavish">Plan</button>
          <button data-page="analysis">Analysis</button>
          <button data-page="archive">Archive</button>
        </div>
        <button id="settingsGear" class="icon-btn" title="Settings" data-page="settings"></button>
      </div>
    </header>

    <!-- Chat-only controls. Declared once here (so their listeners wire up
         once) but RELOCATED by paneHeaderEl into the primary pane's header row
         on render - so they sit on the "New session" row, not a dedicated bar,
         and never shift the primary tabs (the captain design note 2026-07-06: move
         them down onto that row, drop the extra row). Starts hidden; unhidden
         when moved into the pane header. -->
    <div class="chat-toolbar hidden" id="chatToolbar">
      <div class="view-toggle" id="viewToggle">
        <button data-mode="simple" class="active">Simple</button>
        <button data-mode="advanced">Advanced</button>
      </div>
      <button id="backgroundTasksBtn" class="text-btn" title="Background tasks (subagents)">Background tasks</button>
    </div>

    <div class="view-toggle dashboard-subnav hidden" id="dashboardSubnav">
      <button data-page="dashboard" class="active">Overview</button>
      <button data-page="goal">Autopilot<span class="attention-badge running hidden" id="autopilotBadge"></span></button>
      <button data-page="routines">Routines</button>
      <button data-page="review">Review<span class="attention-badge hidden" id="reviewBadge"></span></button>
    </div>

    <!--
      Chat is the workspace alone. The session sidebar - the list, its search, its
      categories and the "+ New chat" button - was removed on 2026-08-04 (task
      22f85eda, the captain: "Vi borde ta bort session vyn från chat", choosing "hela
      sidopanelen bort"). Sessions are reached through Ctrl+K and the Dashboard's
      own queue and Fleet, which is where he actually looks; a fresh chat starts
      from the Dashboard's "New session" section or the palette.

      What the panel carried has NOT been dropped with it: rename and archive
      already existed on a session's Fleet row, "Summarize & carry over" was moved
      there in the same change, "Move to category" is gone on purpose (it only
      encouraged long-lived sessions, which this app is built against), and
      "Remove from Helm" is gone as a second, unexplainable way to hide a session -
      archiving covers it, and anything already hidden is still restorable from the
      Archive page.
    -->
    <div class="layout hidden" id="chatPage">
      <div class="workspace" id="workspace"></div>
    </div>

    <div class="analysis-page" id="dashboardPage"></div>
    <div class="analysis-page hidden" id="jotPage"></div>
    <!-- Queued scheduled prompts (task 7d9d2188) - hidden until something is queued. -->
    <div id="scheduledPromptBar" class="sched-bar hidden"></div>
    <div class="analysis-page hidden" id="goalPage"></div>
    <div class="analysis-page hidden" id="lavishPage"></div>
    <div class="analysis-page hidden" id="routinesPage"></div>
    <!-- Review queue (task ce2d19ab): what is in review, judgment items first. -->
    <div class="analysis-page hidden" id="reviewPage"></div>
    <div class="analysis-page hidden" id="analysisPage"></div>
    <div class="analysis-page hidden" id="archivePage"></div>
    <div class="analysis-page hidden" id="settingsPage"></div>

    <div id="contextMenu" class="context-menu hidden"></div>

    <!-- Command palette (Cmd/Ctrl+K): a keyboard-first launcher over existing
         affordances (navigateToPage, openSessionInPane, the new-session flow).
         Built as a static overlay like #contextMenu; the results list is
         populated dynamically each open since entities (sessions/projects) are
         live. Hidden by default. -->
    <div id="commandPalette" class="cmdk hidden">
      <div class="cmdk-backdrop" id="cmdkBackdrop"></div>
      <div class="cmdk-modal" role="dialog" aria-label="Command palette">
        <input type="text" id="cmdkInput" class="cmdk-input" placeholder="Type a command or search…" autocomplete="off" spellcheck="false" />
        <div id="cmdkList" class="cmdk-list"></div>
      </div>
    </div>

    <!-- Doc viewer: renders a context .md file (CLAUDE.md / DECISIONS.md /
         memory) as readable HTML instead of raw markdown. Same static-overlay
         pattern as #commandPalette; body is populated per open. -->
    <div id="docViewer" class="docv hidden">
      <div class="docv-backdrop" id="docvBackdrop"></div>
      <div class="docv-modal" role="dialog" aria-label="Document viewer">
        <div class="docv-head">
          <span class="docv-title" id="docvTitle"></span>
          <div class="docv-actions">
            <button type="button" id="docvReveal" class="docv-btn" title="Reveal in Explorer">Reveal</button>
            <button type="button" id="docvClose" class="docv-btn" title="Close (Esc)">Close</button>
          </div>
        </div>
        <div class="docv-row">
          <!-- Only populated/shown by openDiffViewer - a changed-files column
               to pick which file's diff to look at (task c3dfbb42: "borde
               finnas en till kolumn där man kan se ändrade filer och väljer
               fil att se diff för där"). openDocViewer (plain .md files)
               hides it, since a single-file doc has nothing to list. -->
          <div class="docv-filelist hidden" id="docvFileList"></div>
          <div class="docv-body md-body" id="docvBody"></div>
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
