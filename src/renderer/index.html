<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Maestro</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="brand"><span class="logo">◆</span><h1>Maestro</h1></div>
      <div class="header-controls">
        <div class="view-toggle" id="viewToggle">
          <button data-mode="simple" class="active">Simple</button>
          <button data-mode="advanced">Advanced</button>
        </div>
        <span class="quota" id="quota">quota: —</span>
      </div>
    </header>

    <div class="layout">
      <nav class="sidebar" id="sidebar">
        <input type="text" id="search" class="search" placeholder="Search sessions…" />
        <div id="sidebarBody"></div>
      </nav>

      <main class="composer">
        <h2>Start or resume a session</h2>
        <div id="resumeBanner" class="resume-banner hidden">
          Resuming <strong id="resumeTitle"></strong>
          <button id="cancelResume">✕ new session instead</button>
        </div>
        <label>
          Repo folder (root on main)
          <div class="folder-row">
            <input type="text" id="cwd" placeholder="D:\Repo\..." />
            <button id="pick">Pick…</button>
          </div>
        </label>
        <label>
          Task / prompt
          <textarea id="prompt" rows="5" placeholder="What should this session do?"></textarea>
        </label>
        <div class="suggest-row">
          <span id="suggestBadge" class="suggest-badge">Suggested: —</span>
          <select id="model">
            <option value="claude-sonnet-5">Sonnet 5</option>
            <option value="claude-opus-4-8">Opus 4.8</option>
            <option value="claude-haiku-4-5-20251001">Haiku 4.5</option>
          </select>
          <select id="effort">
            <option value="low">low</option>
            <option value="medium" selected>medium</option>
            <option value="high">high</option>
            <option value="xhigh">xhigh</option>
            <option value="max">max</option>
          </select>
        </div>
        <button id="start" class="primary">Start session</button>
        <div class="log" id="log"></div>
      </main>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
